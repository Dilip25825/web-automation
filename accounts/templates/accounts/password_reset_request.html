{% extends 'core/base.html' %}
{% block title %}Reset Password | Web Automation with Excel{% endblock %}
{% block content %}
<section class="mx-auto max-w-lg py-6 sm:py-12"><div class="rounded-3xl border border-indigo-100 bg-white p-6 shadow-[0_20px_55px_rgba(49,46,129,.12)] sm:p-9"><span class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-100 text-indigo-700"><i class="fa-solid fa-envelope"></i></span><p class="mt-5 text-xs font-extrabold uppercase tracking-[.18em] text-indigo-600">Password reset</p><h1 class="mt-2 text-3xl font-extrabold text-slate-950">Get email OTP</h1><p class="mt-2 text-sm leading-6 text-slate-500">OTP aapke saved email <strong class="text-slate-700">{{ email }}</strong> par jayega aur 10 minutes tak valid rahega.</p><form method="post" class="mt-7">{% csrf_token %}<button class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-3.5 text-sm font-extrabold text-white"><i class="fa-solid fa-paper-plane mr-2"></i>Send OTP</button></form><p class="mt-6 text-center text-sm text-slate-500"><a class="font-bold text-indigo-700 hover:text-indigo-900" href="{% url 'accounts:profile' %}">Back to My Profile</a></p></div></section>
{% endblock %}
