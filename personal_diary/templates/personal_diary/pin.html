{% extends 'core/base.html' %}{% block content %}<div class="mx-auto max-w-md app-card p-6"><h1 class="text-2xl font-black">Diary PIN</h1>{% if error %}<p class="text-red-700">{{ error }}</p>{% endif %}<form method="post" class="mt-4 space-y-3">{% csrf_token %}{% if has_pin %}<input type="password" inputmode="numeric" name="current_pin" placeholder="Current PIN" required>{% endif %}<input type="password" inputmode="numeric" name="new_pin" placeholder="New 4–12 digit PIN" required><button class="btn btn-primary">Save PIN</button></form>{% if has_pin %}<form method="post" action="{% url 'personal_diary:pin_reset' %}" class="mt-6" data-confirm-delete data-title="Reset diary PIN?" data-text="Locked entries will need a new PIN afterwards." data-confirm-text="Yes, reset">{% csrf_token %}<label>Type RESET to remove PIN <input name="confirmation" required></label><button class="btn btn-outline-danger">Reset PIN</button></form>{% endif %}</div>{% endblock %}
