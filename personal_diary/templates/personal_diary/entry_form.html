{% extends 'core/base.html' %}{% block title %}{{ page_title }}{% endblock %}{% block content %}<div class="mx-auto max-w-3xl"><h1 class="mb-5 text-3xl font-black">{{ page_title }}</h1><form id="diary-form" method="post" class="app-card space-y-4 p-6">{% csrf_token %}<div class="grid gap-4 sm:grid-cols-2"><label>तारीख {{ form.entry_date }}</label><label>समय {{ form.entry_time }}</label></div><label>शीर्षक {{ form.title }}</label><label>आज क्या हुआ? {{ form.content }}</label><div class="grid gap-4 sm:grid-cols-2"><label>मूड {{ form.mood }}</label><label>श्रेणी {{ form.category }}</label></div><label>मूड नोट {{ form.mood_note }}</label><div class="grid gap-4 sm:grid-cols-2"><label>स्थान {{ form.location }}</label><label>मौसम {{ form.weather }}</label></div><label>टैग {{ form.tags_text }}</label><div class="flex gap-4">{{ form.is_draft }} Draft {{ form.is_favorite }} Favourite {{ form.is_locked }} Private</div><div class="flex items-center gap-3"><button class="btn btn-primary">Save diary</button><span id="autosave-state" class="text-sm text-slate-500"></span></div></form></div>{% endblock %}{% block extra_js %}<script>(()=>{const f=document.getElementById('diary-form');if(!f)return;let t,v=null,b=false,url='{% if entry %}{% url "personal_diary:autosave" entry.pk %}{% else %}{% url "personal_diary:autosave_create" %}{% endif %}';const token=()=>f.querySelector('[name=csrfmiddlewaretoken]').value;async function save(){if(b)return;b=true;const s=document.getElementById('autosave-state');s.textContent='Saving';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token()},body:JSON.stringify({title:f.querySelector('#id_title').value,content:f.querySelector('#id_content').value,mood:f.querySelector('#id_mood').value,updated_at:v})}),d=await r.json();if(r.status===409)s.textContent='Newer version exists—reload before saving.';else if(!r.ok)s.textContent='Autosave failed.';else{v=d.updated_at;url=d.autosave_url;f.action=d.edit_url;s.textContent='Saved';}}catch(e){s.textContent='Autosave failed.'}finally{b=false}}f.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(save,800)})})();</script>{% endblock %}
