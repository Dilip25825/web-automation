{% extends 'core/base.html' %}{% block content %}<div class="mx-auto max-w-md app-card p-6"><h1 class="text-2xl font-black">Locked diary entry</h1>{% if has_pin %}<form method="post" action="{% url 'personal_diary:unlock_entry' entry.pk %}" class="mt-4 space-y-3">{% csrf_token %}<input name="pin" inputmode="numeric" type="password" placeholder="Your diary PIN" required><button class="btn btn-primary">Unlock</button></form>{% else %}<p class="mt-3">Set a diary PIN before opening locked entries.</p><a class="btn btn-primary mt-3" href="{% url 'personal_diary:pin_settings' %}">Set PIN</a>{% endif %}</div>{% endblock %}
