{% extends 'core/base.html' %}{% block title %}Diary calendar{% endblock %}{% block content %}<div class="mx-auto max-w-5xl app-card p-6"><div class="flex justify-between"><a href="?year={{ previous_month.year }}&month={{ previous_month.month }}">‹ Previous</a><h1 class="text-2xl font-black">{{ month_name }} {{ year }}</h1><a href="?year={{ next_month.year }}&month={{ next_month.month }}">Next ›</a></div><div class="mt-5 grid grid-cols-7 gap-2">{% for week in weeks %}{% for day,count in week %}<a class="min-h-20 rounded-xl border p-2 {% if day.month != month %}bg-slate-50 text-slate-300{% elif count %}bg-violet-50 border-violet-200{% endif %}" href="{% url 'personal_diary:entry_create' %}?date={{ day|date:'Y-m-d' }}"><b>{{ day.day }}</b>{% if count %}<span class="block text-xs">{{ count }} entries</span>{% endif %}</a>{% endfor %}{% endfor %}</div></div>{% endblock %}
